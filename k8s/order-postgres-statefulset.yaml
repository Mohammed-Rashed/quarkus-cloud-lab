apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: order-postgres
  namespace: quarkus-lab

spec:
  serviceName: order-postgres
  replicas: 1

  selector:
    matchLabels:
      app: order-postgres

  template:
    metadata:
      labels:
        app: order-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: order_db

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: order-postgres-pvc