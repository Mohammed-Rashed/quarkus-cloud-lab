apiVersion: networking.istio.io/v1
kind: DestinationRule

metadata:
  name: order-destination
  namespace: quarkus-lab

spec:
  host: order-service

  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
      trafficPolicy:
        outlierDetection:
          consecutive5xxErrors: 2
          interval: 5s
          baseEjectionTime: 30s
          maxEjectionPercent: 100