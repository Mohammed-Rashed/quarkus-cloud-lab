apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: order-ingress
  namespace: quarkus-lab

spec:
  ingressClassName: nginx

  rules:
    - host: order.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8080